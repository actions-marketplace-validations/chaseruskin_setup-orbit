name: "Setup Orbit"
author: "Chase Ruskin"
branding:
  icon: 'play'
  color: 'blue'
description: Install Orbit, a package manager and build system for VHDL, Verilog, and SystemVerilog
inputs:
  version:
    description: 'A valid semver specifier of the Orbit version to install'
    required: false
    default: null
    
runs:
  using: "composite"
  steps:
    - if: ${{ inputs.version }} == null
      name: Clone repository to determine build version
      shell: bash
      run: |
        git clone https://github.com/chaseruskin/orbit
        cd orbit
        echo "GIT_DESC_VERSION=$(git describe --tags)" >> $GITHUB_ENV
        cd ..
        rm -rf orbit

    - if: ${{ inputs.version }} == null
      name: Install orbit from remote repository using latest version
      env:
        GIT_DESC_VERSION: ${{ env.GIT_DESC_VERSION }}
      uses: baptiste0928/cargo-install@v3
      with:
        crate: orbit
        git: https://github.com/chaseruskin/orbit

    - if: ${{ inputs.version }} != null
      name: Install orbit from remote repository using particular version
      uses: baptiste0928/cargo-install@v3
      with:
        crate: orbit
        git: https://github.com/chaseruskin/orbit
        tag: ${{ inputs.version }}